[project]
name = "patty-apuntes-backend"
version = "0.1.0"
description = "Patty Apuntes API - FastAPI + SQLite/PostgreSQL migratable"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.0",
    "psycopg2-binary>=2.9.10",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B008", "E501", "E701"]

[tool.ruff.lint.per-file-ignores]
"app/routers/*" = ["B008"]
"app/db/*" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]
