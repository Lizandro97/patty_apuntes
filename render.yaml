services:
  - type: web
    name: patty-api
    runtime: python
    buildCommand: pip install -r apps/backend/requirements.txt
    startCommand: sh -c "cd apps/backend && python -c 'from app.db.init import init_db; init_db()' && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.14.0
